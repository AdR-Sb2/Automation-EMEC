name: Extrair atividades Field Service

on:
  schedule:
    # 07:00 no horário de Brasília (10:00 UTC)
    - cron: "0 10 * * *"
  workflow_dispatch:
    inputs:
      datas:
        description: "Datas AAAA-MM-DD separadas por vírgula, ou intervalo com ':'. Vazio = dia anterior"
        required: false
        default: ""
      email:
        description: "E-mail para cópia (opcional)"
        required: false
        default: ""
      request_id:
        description: "Usado pela página web (não preencher manualmente)"
        required: false
        default: ""
      equipe:
        description: "Superintendência (equipe de manutenção)"
        required: false
        default: "MANUTENÇÃO - BAIXADA 2"

concurrency:
  group: field-service-oracle
  cancel-in-progress: false

jobs:
  extrair:
    runs-on: ubuntu-latest
    timeout-minutes: 90
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - run: |
          pip install playwright openpyxl
          playwright install --with-deps chromium

      - name: Rodar extração
        env:
          OFSC_USUARIO: ${{ secrets.OFSC_USUARIO }}
          OFSC_SENHA: ${{ secrets.OFSC_SENHA }}
          PASTA_SAIDA: saida
          DATAS: ${{ github.event.inputs.datas }}
          EQUIPE: ${{ github.event.inputs.equipe }}
        run: python extrai_fieldservice.py

      - name: Enviar arquivos para Drive e Outlook via Apps Script
        if: always()
        env:
          APPS_URL: ${{ secrets.APPS_URL }}
          APPS_SECRET: ${{ secrets.APPS_SECRET }}
          EMAIL: ${{ github.event.inputs.email || secrets.EMAIL_DESTINO }}
          REQUEST_ID: ${{ github.event.inputs.request_id }}
          JOB_STATUS: ${{ job.status }}
        run: |
          python - <<'EOF'
          import os, glob, base64, json, urllib.request

          url = os.environ["APPS_URL"]
          segredo = os.environ["APPS_SECRET"]
          email = os.environ["EMAIL"]
          rid = os.environ["REQUEST_ID"]

          def enviar(nome, conteudo_bytes):
              payload = {
                  "secret": segredo,
                  "request_id": rid,
                  "email": email,
                  "arquivo": nome,
                  "conteudo": base64.b64encode(conteudo_bytes).decode(),
              }
              req = urllib.request.Request(
                  url,
                  data=json.dumps(payload).encode(),
                  headers={"Content-Type": "application/json"},
              )
              resposta = urllib.request.urlopen(req, timeout=180).read().decode()
              print(nome, "->", resposta)

          for caminho in sorted(glob.glob("saida/atividades_*.xlsx")):
              with open(caminho, "rb") as f:
                  enviar(os.path.basename(caminho), f.read())

          # A página web usa STATUS.txt para acompanhar execuções manuais.
          # No agendamento diário, envia somente os relatórios Excel.
          if rid:
              status = "ok" if os.environ["JOB_STATUS"] == "success" else "erro"
              enviar("STATUS.txt", status.encode())
          EOF

      - name: Guardar arquivos e logs
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: atividades-${{ github.run_id }}
          path: saida/
          retention-days: 30
